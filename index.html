<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Reservation | Tisal Group</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/smartbusmanager/tisalgroup/main/logo2.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #1e293b; margin: 0; padding: 0; }
        
        .bg-navy-premium { 
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%) !important; 
            color: white !important;
        }
        
        .text-gold { color: #d4af37; }
        .bg-gold-gradient { background: linear-gradient(135deg, #d4af37 0%, #f1c40f 100%); }

        .hero-section {
            background-image: linear-gradient(to right, rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.7)), 
                              url('https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?q=80&w=1200');
            background-size: cover;
            background-position: center;
        }

        .bus-card {
            transition: all 0.3s ease;
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
        .bus-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .modal-overlay {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
        }

        .btn-gold {
            background: linear-gradient(135deg, #c5a028 0%, #e1b319 100%) !important;
            transition: all 0.3s ease;
            color: white !important;
        }

        #modalTujuan:not(.hidden) { display: flex !important; }

        @media (min-width: 1280px) {
            .container { max-width: 1300px !important; }
        }
    </style>
</head>
<body>

    <nav class="bg-navy-premium p-4 text-white shadow-xl sticky top-0 z-50">
        <div class="container mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-white p-1 rounded-lg">
                    <img src="https://raw.githubusercontent.com/smartbusmanager/tisalgroup/main/logo2.png" class="h-8">
                </div>
                <div>
                    <h1 class="text-lg font-extrabold tracking-tighter leading-none uppercase">Tisal Group</h1>
                    <p class="text-[8px] uppercase tracking-[0.2em] text-gold font-bold">Executive Bus Service</p>
                </div>
            </div>
            <div class="text-right hidden sm:block">
                <p class="text-[8px] text-slate-400 uppercase font-bold">Booking Service</p>
                <p class="text-xs font-bold text-gold">0856 0194 7668</p>
            </div>
        </div>
    </nav>

    <header class="hero-section pt-8 pb-16 px-6 text-white relative">
        <div class="container mx-auto relative z-10 text-left">
            <h2 class="text-2xl md:text-4xl font-extrabold mb-2 leading-tight max-w-xl">
                Perjalanan Berkelas,<br>
                <span class="text-gold">Kenyamanan Prioritas Kami</span>
            </h2>
            <p class="text-slate-300 text-[10px] md:text-xs mb-6 italic font-light opacity-80">
                "Bus Pariwisata Dengan Armada Kelas Eksekutif"
            </p>
            
            <div class="max-w-xs bg-white/10 backdrop-blur-md p-1 rounded-xl border border-white/10 shadow-2xl">
                <div class="flex items-center bg-white rounded-lg overflow-hidden">
                    <div class="pl-3 text-slate-400 text-xs">
                        <i class="fas fa-calendar-alt"></i>
                    </div>
                    <input type="date" id="inputTanggal" onchange="cekJadwalFirebase()" 
                           class="w-full p-2.5 text-slate-800 outline-none font-bold bg-transparent text-xs">
                </div>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 -mt-10 relative z-20 pb-10">
        <div class="flex flex-col items-center mb-4">
            <p class="bg-white px-4 py-1.5 rounded-full shadow-sm text-[8px] font-black tracking-[0.2em] text-slate-400 uppercase border border-slate-50">
                Daftar Armada Tersedia
            </p>
        </div>

        <div id="loader" class="text-center p-10 hidden">
            <div class="animate-spin rounded-full h-8 w-8 border-4 border-slate-200 border-t-gold mx-auto"></div>
        </div>
        
        <div id="fleet-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            </div>
    </main>

    <div id="modalTujuan" class="fixed inset-0 z-[60] flex items-center justify-center p-4 modal-overlay hidden">
        <div class="bg-white rounded-[2rem] w-full max-w-sm overflow-hidden shadow-2xl">
            <div class="bg-navy-premium p-6 text-white relative">
                <div class="w-12 h-12 bg-gold-gradient rounded-xl flex items-center justify-center mb-3 shadow-lg">
                    <i class="fas fa-location-arrow text-xl text-navy-premium"></i>
                </div>
                <h3 class="text-xl font-extrabold tracking-tight">Tujuan Perjalanan</h3>
                <p class="text-[10px] text-slate-400 mt-1 uppercase tracking-widest">Informasi Rencana Trip</p>
            </div>
            <div class="p-6">
                <div class="space-y-4">
                    <div>
                        <label class="text-[9px] font-black text-slate-400 uppercase tracking-widest block mb-1">Lokasi Tujuan</label>
                        <div class="flex items-center bg-slate-50 border border-slate-100 rounded-xl px-4 focus-within:border-gold transition-all">
                            <input type="text" id="tujuanInput" placeholder="Contoh: Wisata Jogja" 
                                   class="w-full py-3 outline-none font-bold text-slate-800 bg-transparent text-sm">
                        </div>
                    </div>
                    <button onclick="prosesKeWA()" class="btn-gold w-full py-3.5 rounded-xl font-black text-white text-[10px] tracking-[0.2em] uppercase shadow-lg flex items-center justify-center gap-2">
                        KONFIRMASI WA <i class="fab fa-whatsapp text-sm"></i>
                    </button>
                    <button onclick="closeModal()" class="w-full py-1 text-slate-400 font-bold text-[9px] uppercase tracking-widest">
                        BATAL
                    </button>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-navy-premium py-3 text-center border-t border-white/5">
        <p class="text-slate-500 text-[8px] font-bold tracking-[0.3em] uppercase">
            &copy; 2026 TISAL GROUP MANAGEMENT SYSTEM
        </p>
    </footer>

    <script>
        const FIREBASE_URL = "https://bus-managemen-5fca8-default-rtdb.asia-southeast1.firebasedatabase.app/tisalgroup/.json";
        const WA_NUMBER = "6285601947668";
        
        let selectedBus = "";
        let selectedDate = "";

        async function cekJadwalFirebase() {
            const tgl = document.getElementById('inputTanggal').value;
            const container = document.getElementById('fleet-container');
            const loader = document.getElementById('loader');
            
            selectedDate = tgl;
            container.innerHTML = '';
            loader.classList.remove('hidden');

            try {
                const response = await fetch(FIREBASE_URL + "?t=" + new Date().getTime());
                const data = await response.json();
                const busesData = data.buses || [];
                const schedulesData = data.schedules || [];
                loader.classList.add('hidden');

                if (busesData.length === 0) {
                    container.innerHTML = '<p class="text-center col-span-full text-slate-500 text-xs">Armada belum terdaftar.</p>';
                    return;
                }

                busesData.forEach(bus => {
                    const isBooked = schedulesData.some(s => s.date === tgl && String(s.busId) === String(bus.id));
                    container.innerHTML += renderCard(bus, isBooked);
                });
            } catch (e) { 
                loader.classList.add('hidden');
                console.error("Fetch error:", e);
            }
        }

        function renderCard(bus, isBooked) {
            const status = isBooked 
                ? { label: 'SUDAH DIPESAN', color: 'bg-rose-100 text-rose-600', btn: 'bg-slate-100 text-slate-400', txt: 'PENUH', act: '' }
                : { label: 'UNIT TERSEDIA', color: 'bg-emerald-100 text-emerald-600', btn: 'bg-navy-premium text-white shadow-md', txt: 'BOOKING SEKARANG', act: `onclick="openModal('${bus.name}')"` };

            const infoFitur = bus.features && bus.features.trim() !== "" ? bus.features : "Executive Class Service";
            const fotoBus = bus.photo && bus.photo.trim() !== "" ? bus.photo : "https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?q=80&w=800";

            return `
                <div class="bus-card bg-white rounded-2xl overflow-hidden shadow-sm flex flex-col h-full border border-slate-50 text-left">
                    <div class="h-40 bg-slate-100 relative group overflow-hidden">
                        <img src="${fotoBus}" class="w-full h-full object-cover transition duration-700 group-hover:scale-110">
                        <span class="absolute top-3 left-3 ${status.color} text-[7px] font-black px-2 py-1 rounded-full shadow-sm z-10 tracking-widest">
                            ${status.label}
                        </span>
                    </div>
                    <div class="p-4 flex flex-col flex-grow">
                        <div class="mb-2">
                            <h3 class="font-extrabold text-slate-900 text-sm tracking-tight leading-none uppercase truncate">${bus.name}</h3>
                            <p class="text-[9px] text-gold font-black tracking-widest mt-1 uppercase leading-none">${bus.plate}</p>
                        </div>
                        <div class="mb-4 p-2.5 bg-slate-50 rounded-xl border border-slate-100">
                            <p class="text-[7px] font-black text-slate-400 uppercase tracking-widest mb-1">Spesifikasi Unit:</p>
                            <p class="text-[10px] text-slate-600 font-semibold italic leading-tight">"${infoFitur}"</p>
                        </div>
                        <div class="mt-auto">
                            <button ${status.act} class="w-full py-3 rounded-xl font-extrabold text-[8px] tracking-[0.2em] uppercase transition-all active:scale-95 flex items-center justify-center relative z-20 ${status.btn}">
                                <span class="relative z-30">${status.txt}</span>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function openModal(busName) {
            selectedBus = busName;
            document.getElementById('modalTujuan').classList.remove('hidden');
            document.getElementById('tujuanInput').focus();
        }

        function closeModal() {
            document.getElementById('modalTujuan').classList.add('hidden');
            document.getElementById('tujuanInput').value = '';
        }

function prosesKeWA() {
    const tujuan = document.getElementById('tujuanInput').value;
    if (!tujuan) return alert("Mohon cantumkan tujuan perjalanan Anda agar kami dapat memberikan penawaran terbaik.");

    // Format Tanggal agar lebih cantik (Contoh: 17 Februari 2026)
    const opsiTanggal = { day: 'numeric', month: 'long', year: 'numeric' };
    const tanggalCantik = new Date(selectedDate).toLocaleDateString('id-ID', opsiTanggal);

    const teks = `*RESERVASI ARMADA TISAL GROUP* 🚐💨
_______________________________

Halo Admin *Tisal Group*,
Saya tertarik untuk melakukan pemesanan unit bus dengan rincian sebagai berikut:

🔹 *Unit Armada:* ${selectedBus}
🔹 *Rencana Trip:* ${tujuan}
🔹 *Tanggal Keberangkatan:* ${tanggalCantik}

Mohon informasi ketersediaan unit tersebut dan estimasi biayanya. Terima kasih, saya tunggu kabar baiknya. 🙏✨`;

    const waLink = `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(teks)}`;
    window.open(waLink, '_blank');
    closeModal();
}

        window.onload = () => {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('inputTanggal').value = today;
            cekJadwalFirebase();
        };
    </script>
</body>
</html>
